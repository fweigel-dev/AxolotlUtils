plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	maven {
		name = "GitHubPackages"
		url = uri("https://maven.pkg.github.com/fweigel-dev/fweigel-util-lib")
		credentials {
			username = System.getenv("GITHUB_ACTOR") ?: ""
			password = System.getenv("GITHUB_TOKEN") ?: ""
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"axolotlutils" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	clientTest {
		compileClasspath += sourceSets.client.output + sourceSets.main.output
		runtimeClasspath += sourceSets.client.output + sourceSets.main.output
	}
}

configurations {
	clientTestImplementation.extendsFrom clientImplementation, implementation
	clientTestRuntimeOnly.extendsFrom clientRuntimeOnly, runtimeOnly
}

dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        implementation "dev.fweigel:fweigel-util-lib:${project.fweigel_util_lib_version}"

        clientTestImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
        clientTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register('clientTest', Test) {
	group = 'verification'
	testClassesDirs = sourceSets.clientTest.output.classesDirs
	classpath = sourceSets.clientTest.runtimeClasspath
	useJUnitPlatform()
}

check.dependsOn clientTest

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
